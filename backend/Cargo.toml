[package]
name = "cpr-config-plugin"
version = "1.0.4"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[dependencies]
gateway-plugin-sdk = { path = "../vendor/gateway-plugin-sdk", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
base64 = "0.22.1"
flate2 = "1.1.10"
sha2 = "0.10.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "io-util", "rt", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
